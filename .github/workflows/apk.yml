name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Uygulama sürümü = derleme numarası. Uygulama yeni sürümü bununla anlar.
      APP_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Web dosyalarını derle
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk fiyatlab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fiyatlab-apk
          path: fiyatlab.apk

      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" fiyatlab.apk \
            --title "Fiyatlab $TAG" \
            --notes "Android için indirilebilir APK. Telefona indirip açın (bilinmeyen kaynaklardan yüklemeye izin vermeniz gerekebilir). Uygulama yüklüyse güncelleme bildirimi otomatik gelir." \
            --latest
