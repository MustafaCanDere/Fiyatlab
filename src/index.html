<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiyatlab</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --accent: #e8590c; --accent-ink: #ffffff; --good: #2b8a3e; --bad: #c92a2a; --warn: #e67700;
    --chip: #f1efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --card: #1f1f1d; --text: #ecebe6; --muted: #a09e97; --line: #33322e;
      --accent: #ff7a2e; --accent-ink: #1a1a1a; --good: #51cf66; --bad: #ff6b6b; --warn: #ffa94d;
      --chip: #2a2926;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: grid; gap: 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; }
  input, textarea { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; }
  textarea { resize: vertical; min-height: 44px; }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent);
    color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row input { flex: 1; }
  #status { margin: 20px 0; color: var(--muted); }
  #status ul { margin: 8px 0 0; padding-left: 20px; font-size: 14px; max-height: 200px; overflow: auto; }
  .error { color: var(--bad); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    margin-top: 16px; }
  .card h2 { font-size: 18px; margin: 0 0 12px; }
  .hero h2 { font-size: 22px; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 14px; }
  .price { font-size: 26px; font-weight: 700; margin-top: 8px; }
  .scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .score b { font-size: 24px; display: block; }
  .bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; margin-top: 4px; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .two { grid-template-columns: 1fr; } .row { flex-direction: column; } }
  ul.plain { margin: 0; padding-left: 20px; }
  .pros li::marker { content: "✓  "; color: var(--good); }
  .cons li::marker { content: "✗  "; color: var(--bad); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--chip); }
  .verdict { font-size: 20px; font-weight: 700; }
  .v-Al { color: var(--good); } .v-Alma { color: var(--bad); }
  .v-Bekle, .v-Alternatife { color: var(--warn); }
  .alt { border-top: 1px solid var(--line); padding: 12px 0; }
  .alt:first-of-type { border-top: 0; padding-top: 0; }
  .alt-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  a { color: var(--accent); word-break: break-word; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--muted); width: 40%; }
  .small { font-size: 13px; color: var(--muted); }
  main { padding-top: max(32px, env(safe-area-inset-top)); }
  .settings { margin: 0 0 16px; }
  .settings summary { cursor: pointer; font-weight: 600; }
  .settings[open] summary { margin-bottom: 12px; }
  .settings label { display: grid; gap: 6px; margin-top: 10px; font-size: 14px; }
  select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; }
  .settings button { margin-top: 12px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  button.secondary { background: var(--chip); color: var(--text); }
  .ok { color: var(--good); font-weight: 600; }
  .error { word-break: break-word; }
  .update { display: flex; gap: 12px; align-items: center; justify-content: space-between;
    background: var(--card); border: 2px solid var(--accent); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
  .btn { padding: 10px 16px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
    font-weight: 600; text-decoration: none; white-space: nowrap; }
  .update[hidden] { display: none; }
  .version { text-align: center; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <div id="update" class="update" hidden></div>
  <h1>Fiyatlab</h1>
  <p class="sub">Bir ürün linki yapıştır. Ürünü web'de araştırıp yorumları, fiyatı ve artı-eksilerini çıkarayım, sana daha iyi alternatifler önereyim.</p>

  <details id="settings" class="card settings">
    <summary>Ayarlar <span id="keyState" class="badge"></span></summary>
    <label>Yapay zeka
      <select id="provider"></select>
    </label>
    <label><span id="keyLabel">API anahtarı</span>
      <input id="apiKey" type="password" autocomplete="off">
    </label>
    <p class="small">Anahtarı <a id="keyLink" href="#" target="_blank" rel="noopener noreferrer">buradan</a> alabilirsin. Sadece bu cihazda saklanır.</p>
    <label>Model
      <input id="model" list="modelList" autocomplete="off" spellcheck="false">
      <datalist id="modelList"></datalist>
    </label>
    <p class="small">Listeden seçebilir ya da başka bir model adı yazabilirsin.</p>
    <div class="btns">
      <button id="saveKey" type="button">Kaydet</button>
      <button id="testKey" type="button" class="secondary">Anahtarı dene</button>
    </div>
    <p id="testResult" class="small" aria-live="polite"></p>
  </details>

  <form id="form">
    <div class="row">
      <input id="url" type="url" required placeholder="https://www.trendyol.com/... veya hepsiburada, amazon linki">
      <button id="go" type="submit">Analiz et</button>
    </div>
    <textarea id="note" rows="2" placeholder="İsteğe bağlı: bütçen, ne için kullanacağın, önemsediğin özellikler..."></textarea>
  </form>

  <div id="status" hidden></div>
  <div id="result"></div>
  <p id="version" class="small version"></p>
</main>

<script src="app.js"></script>
</body>
</html>
